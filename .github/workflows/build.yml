name: Build Nami APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Nami Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Cache Pub Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Generate Android Platform Files
        run: |
          rm -rf android
          flutter create --platforms=android --org com.piyush --project-name nami .

      - name: Inject Speed Optimizations into gradle.properties
        run: |
          cat << 'PROP_EOF' >> android/gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableJetifier=true
          PROP_EOF

      - name: Install Flutter Dependencies
        run: flutter pub get

Inject Permissions, AudioServiceActivity & Background Service
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "READ_MEDIA_AUDIO" "$MANIFEST"; then
            sed -i '/<application/i \
              <uses-permission android:name="android.permission.INTERNET"/>\n\
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n\
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n\
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n\
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n\
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n\
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n\
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\n\
              <uses-permission android:name="android.permission.WAKE_LOCK"/>' "$MANIFEST"
          fi

          if ! grep -q "AudioService" "$MANIFEST"; then
            sed -i '/<\/application>/i \
              <service android:name="com.ryanheise.audioservice.AudioService" android:foregroundServiceType="mediaPlayback" android:exported="true">\n\
                <intent-filter>\n\
                  <action android:name="android.media.browse.MediaBrowserService" />\n\
                </intent-filter>\n\
              </service>\n\
              <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver" android:exported="true">\n\
                <intent-filter>\n\
                  <action android:name="android.intent.action.MEDIA_BUTTON" />\n\
                </intent-filter>\n\
              </receiver>' "$MANIFEST"
          fi

          sed -i 's/android:name=".MainActivity"/android:name="com.ryanheise.audioservice.AudioServiceActivity"/g' "$MANIFEST"
          MAIN_KT=$(find android/app/src/main -name "MainActivity.kt" | head -n 1)
          if [ -n "$MAIN_KT" ]; then
            PKG_LINE=$(grep "^package " "$MAIN_KT" | head -n 1)
            cat << KT_EOF > "$MAIN_KT"
          $PKG_LINE

          import com.ryanheise.audioservice.AudioServiceActivity

          class MainActivity: AudioServiceActivity()
          KT_EOF
          fi

