name: Build & Release Nami Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish signed APK to GitHub Releases'
        type: boolean
        default: false
      release_tag:
        description: 'Release tag (e.g. v2.1.0) when publishing manually'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  analyze:
    name: Pre-Build Flutter Analyze (~45s)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space for Android NDK
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk-bundle || true
          df -h

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock', '**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Run Dart static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  build-android:
    name: Build Optimized ARM64 Release APK
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Pub & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-build-${{ hashFiles('**/pubspec.yaml', '**/build.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Ensure Android platform scaffolding
        run: |
          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            flutter create --platforms=android --org=com.piyush --project-name=nami .
          fi

      - name: Configure native Android manifest, USB DAC, ProGuard & signing
        env:
          NAMI_KEYSTORE_B64: ${{ secrets.NAMI_KEYSTORE_B64 }}
          NAMI_KEY_PASS: ${{ secrets.NAMI_KEY_PASS }}
        run: |
          if [ -f "scripts/configure_android_native.py" ]; then
            python3 scripts/configure_android_native.py
          elif [ -f "patch_manifest.py" ]; then
            python3 patch_manifest.py
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Signed ARM64 Release APK (Monotonic CI Build Number)
        run: |
          BUILD_NUM=$((100 + ${{ github.run_number }}))
          echo "Using monotonic versionCode: $BUILD_NUM"
          flutter build apk --release --target-platform android-arm64 --build-number=$BUILD_NUM
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/nami-arm64-v8a.apk
          (cd dist && sha256sum nami-arm64-v8a.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nami-arm64-release-apk
          path: |
            dist/nami-arm64-v8a.apk
            dist/SHA256SUMS.txt
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built APK artifact
        uses: actions/download-artifact@v4
        with:
          name: nami-arm64-release-apk
          path: dist

      - name: Determine release tag
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="v2.0.0-build.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with Signed APK & Checksums
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Nami Music ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/nami-arm64-v8a.apk
            dist/SHA256SUMS.txt
