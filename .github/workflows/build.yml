name: Build Nami APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Nami Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Cache Pub Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Generate Android Platform Files
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.piyush.nami --project-name nami .
          fi

      - name: Inject Speed Optimizations into gradle.properties
        run: |
          cat << 'PROP_EOF' >> android/gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableJetifier=true
          PROP_EOF

      - name: Install Flutter Dependencies
        run: flutter pub get
      - name: Generate Isar Database Schema
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Inject Permissions and Background Audio Service into AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "READ_MEDIA_AUDIO" "$MANIFEST"; then
            sed -i '/<application/i \
            <uses-permission android:name="android.permission.INTERNET"/>\n\
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n\
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n\
            <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n\
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n\
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\n\
            <uses-permission android:name="android.permission.WAKE_LOCK"/>' "$MANIFEST"
          fi
          
          if ! grep -q "AudioService" "$MANIFEST"; then
            sed -i '/<activity/i \
            <service android:name="com.ryanheise.audioservice.AudioService" android:foregroundServiceType="mediaPlayback" android:exported="true">\n\
                <intent-filter>\n\
                    <action android:name="android.media.browse.MediaBrowserService" />\n\
                </intent-filter>\n\
            </service>\n\
            <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver" android:exported="true">\n\
                <intent-filter>\n\
                    <action android:name="android.intent.action.MEDIA_BUTTON" />\n\
                </intent-filter>\n\
            </receiver>' "$MANIFEST"
          fi

      - name: Force compileSdk 36 in App & All Plugins
        run: |
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/targetSdk = .*/targetSdk = 35/g' android/app/build.gradle.kts
            sed -i 's/minSdk = .*/minSdk = 24/g' android/app/build.gradle.kts
          fi

          find / -name "build.gradle*" -path "*pub-cache*" 2>/dev/null | while read -r gradle_file; do
            if [[ "$gradle_file" == *.kts ]]; then
              sed -i -E 's/^[[:space:]]*compileSdk(Version)?[[:space:]=(].*/    compileSdk = 36/g' "$gradle_file"
            else
              sed -i -E 's/^[[:space:]]*compileSdk(Version)?[[:space:]=(].*/        compileSdkVersion 36/g' "$gradle_file"
            fi
          done

          cat << 'KTS_EOF' > android/build.gradle.kts
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          val newBuildDir: Directory = rootProject.layout.buildDirectory.dir("../../build").get()
          rootProject.layout.buildDirectory.value(newBuildDir)

          subprojects {
              val newSubprojectBuildDir: Directory = newBuildDir.dir(project.name)
              project.layout.buildDirectory.value(newSubprojectBuildDir)
          }

          subprojects {
              project.evaluationDependsOn(":app")
          }

          subprojects {
              val forceSdk36: Action<Project> = Action {
                  extensions.findByType(com.android.build.gradle.BaseExtension::class.java)?.apply {
                      compileSdkVersion(36)
                      defaultConfig {
                          minSdk = 24
                      }
                  }
              }
              if (project.state.executed) {
                  forceSdk36.execute(project)
              } else {
                  project.afterEvaluate(forceSdk36)
              }
          }

          tasks.register<Delete>("clean") {
              delete(rootProject.layout.buildDirectory)
          }
          KTS_EOF

      - name: Build Optimized ARM64 Release APK
        run: flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nami-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish Automatic GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Nami Build #${{ github.run_number }}"
          files: build/app/outputs/flutter-apk/app-release.apk
          prerelease: false
