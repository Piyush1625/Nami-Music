name: Build Nami APK

on:
  push:
    branches: [ media-kit-engine ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Nami Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Cache Pub Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Generate Android Platform Files
        run: |
          rm -rf android
          flutter create --platforms=android --org com.piyush --project-name nami .

      - name: Inject Speed Optimizations into gradle.properties
        run: |
          cat << 'PROP_EOF' >> android/gradle.properties
          org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableJetifier=true
          PROP_EOF

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Patch Android Manifest and MainActivity via Python
        run: python3 scripts/patch_manifest.py

      - name: Build Optimized ARM64 Release APK
        run: flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nami-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish Automatic GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Nami Build #${{ github.run_number }}"
          files: build/app/outputs/flutter-apk/app-release.apk
          prerelease: false
